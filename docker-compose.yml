services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: windband-backend
    ports:
      - "8000:8000"
    environment:
      - DEFAULT_CUTOFF=09:00
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:8000
    container_name: windband-web
    ports:
      - "3000:80"
    depends_on:
      - backend

